name: Cloud review

on:
  push:
    branches: [main]
    paths-ignore: ['scripts/vendor-art.mjs', '.github/workflows/vendor-art.yml', 'scripts/profile-render.ts', '.github/workflows/profile-render.yml', 'scripts/network-review.ts', '.github/workflows/network-review.yml', 'docs/**', 'README.md', 'AGENTS.md']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build and simulation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check and production build
        run: npm run build
      - name: Unit and room tests
        run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: houseflight-build
          retention-days: 14
          path: |
            dist
            dist-server
  review:
    permissions:
      contents: write
    name: Real browser play and video
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: houseflight-build
          path: .
      - name: Install cloud browser
        run: npx playwright install --with-deps chromium
      - name: Install Korean fonts and video encoder
        run: sudo apt-get install -y fonts-noto-cjk ffmpeg
      - name: Record actual two and four-player gameplay
        env:
          REVIEW_BASE_URL: http://127.0.0.1:3000
          FFMPEG_PATH: ffmpeg
          REVIEW_SLICE_ONLY: '0'
          REVIEW_CAPTURE: 'native'
        run: |
          npm start > /tmp/game-heaven-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/health
          npm run review
          npm run review:html
      - name: Export verified screenshots for repository review
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/export-stills.mjs
      - name: Upload stills for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: houseflight-stills
          retention-days: 30
          if-no-files-found: warn
          path: |
            artifacts/*.png
            artifacts/action-strip.jpg
            artifacts/verification.json
            artifacts/still-blobs.json
            artifacts/failure-details.json
      - name: Upload video and standalone HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: houseflight-review
          retention-days: 30
          if-no-files-found: warn
          path: |
            artifacts/review.html
            artifacts/houseflight-preview.mp4
            artifacts/combat-sheet.jpg
            artifacts/action-strip.jpg
            artifacts/poster.png
            artifacts/review-page.png
            artifacts/verification.json
            artifacts/menu.png
            artifacts/lobby.png
            artifacts/combat.png
            artifacts/gate.png
            artifacts/camp.png
            artifacts/canal.png
            artifacts/boss.png
            artifacts/results.png
            artifacts/four-player.png
            artifacts/full-playthrough.mp4
            artifacts/failure-*.png
            artifacts/failure-details.json
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/game-heaven-server.log || true
