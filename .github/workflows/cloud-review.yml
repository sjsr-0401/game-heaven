name: Cloud review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Build, test and record
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check and production build
        run: npm run build
      - name: Unit and room tests
        run: npm test
      - name: Install cloud browser
        run: npx playwright install --with-deps chromium
      - name: Install Korean fonts
        run: sudo apt-get install -y fonts-noto-cjk
      - name: Record real two-player gameplay
        env:
          REVIEW_BASE_URL: http://127.0.0.1:3000
        run: |
          npm start > /tmp/game-heaven-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/health
          npm run review
          npm run review:html
      - name: Upload video and standalone HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starwood-review
          retention-days: 30
          if-no-files-found: warn
          path: |
            artifacts/review.html
            artifacts/starwood-preview.mp4
            artifacts/poster.png
            artifacts/review-page.png
            artifacts/verification.json
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/game-heaven-server.log || true
