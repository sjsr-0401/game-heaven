name: Cloud render profile
on:
  push:
    branches: [main]
    paths: ['scripts/profile-render.ts', '.github/workflows/profile-render.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y xvfb xauth mesa-utils fonts-noto-cjk
      - name: Measure real browser rendering and video overhead
        env:
          REVIEW_BASE_URL: http://127.0.0.1:3000
        run: |
          npm start > /tmp/houseflight-profile-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then break; fi
            sleep 1
          done
          xvfb-run -a npx tsx scripts/profile-render.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: houseflight-render-profile
          path: artifacts/profile
          retention-days: 30
